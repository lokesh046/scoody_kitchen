# Optional nginx caching for the public website and its public API reads.
# NOT applied anywhere yet -- review, then test on beta first.
#
# Why: the pages are static, but every visit still asks the backend for banners, FAQs,
# categories and the blog, and site images carry no cache lifetime at all. These
# additions let browsers and nginx answer repeat requests without reaching the backend.
#
# Trade-off: an admin edit can take up to the lifetime below to show for visitors whose
# browser or nginx already holds a copy (the backend's own cache clears immediately).

# ---- 1. http {} level (e.g. /etc/nginx/conf.d/hearth-cache.conf) --------------------
proxy_cache_path /var/cache/nginx/hearth_api
                 levels=1:2 keys_zone=hearth_api:10m max_size=100m inactive=1h use_temp_path=off;

# ---- 2. In the website server block: site images ------------------------------------
# Images are not content-hashed, so keep the lifetime moderate.
location /images/ {
    expires 30d;
    add_header Cache-Control "public";
}

# ---- 3. In the API location (the one that proxy_passes to the backend) --------------
# Only anonymous GETs for public, rarely changing content are cached. Anything with an
# Authorization header or cookie bypasses the cache, so signed-in data is never shared.
location ~ ^/(api/)?(banners|faqs|categories|features/public)(/|$) {
    # Same upstream settings as the existing API proxy block.
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache hearth_api;
    proxy_cache_methods GET;
    proxy_cache_key "$scheme$request_uri";
    proxy_cache_valid 200 5m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
    proxy_cache_lock on;                       # one request refills; the rest wait
    proxy_cache_bypass $http_authorization $cookie_access_token;
    proxy_no_cache     $http_authorization $cookie_access_token;

    add_header Cache-Control "public, max-age=300" always;
    add_header X-Cache-Status $upstream_cache_status always;   # HIT / MISS, for checking
}

# Check it worked:   curl -sI https://<site>/api/banners/?placement=home | grep -i x-cache
# Second request should say HIT.
