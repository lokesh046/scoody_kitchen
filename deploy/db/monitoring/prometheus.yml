global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]
  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]
  # Is the public site really answering? Probed from this server through the internet.
  - job_name: website
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets:
          - https://hearthandone.com/
          - https://api.hearthandone.com/health
          - https://api-beta.hearthandone.com/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115
