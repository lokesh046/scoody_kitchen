global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]
  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
