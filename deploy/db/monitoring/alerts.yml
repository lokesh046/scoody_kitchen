# Alert rules. Each one says what is wrong and what to do about it in plain words, because the
# person reading the email may not be at a computer. `for:` avoids paging on a blip.
groups:
  - name: database
    rules:
      - alert: DatabaseDown
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "The database is not answering"
          description: "Postgres has not responded for over a minute, so the website and app cannot load data. Check `docker ps` and `docker logs hearth_pg` on the server. Recovery steps: docs/DB_RECOVERY.md."

      - alert: DatabaseRestarted
        expr: time() - pg_postmaster_start_time_seconds < 300
        labels: { severity: warning }
        annotations:
          summary: "The database restarted in the last 5 minutes"
          description: "Postgres started recently. If you did not restart it, look in `docker logs hearth_pg` for the reason (out of memory, crash)."

      - alert: TooManyConnections
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "More than 80% of database connections are in use"
          description: "The app may soon fail with 'too many connections'. Look for stuck sessions in pg_stat_activity, or raise max_connections."

      - alert: LongRunningTransaction
        expr: max(pg_stat_activity_max_tx_duration{state!~"idle"}) > 300
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "A database transaction has been open for more than 5 minutes"
          description: "A stuck transaction blocks cleanup and can slow everything down. Find it in pg_stat_activity and end it if it is stuck."

      - alert: LowCacheHitRatio
        expr: sum(rate(pg_stat_database_blks_hit[15m])) / (sum(rate(pg_stat_database_blks_hit[15m])) + sum(rate(pg_stat_database_blks_read[15m])) + 1) < 0.9
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "Most reads are going to disk, not memory"
          description: "The database may need more memory (shared_buffers) or an index for a frequent query. Check the slow queries in Grafana."

      - alert: DeadlocksDetected
        expr: increase(pg_stat_database_deadlocks[30m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "The database detected deadlocks"
          description: "Two requests blocked each other and one was cancelled. Look in `docker logs hearth_pg` for the queries involved."

  - name: backups
    rules:
      - alert: WalArchivingFailing
        expr: increase(pg_stat_archiver_failed_count[15m]) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Continuous backup (WAL archiving) is failing"
          description: "Postgres cannot hand its change log to pgBackRest. Until fixed you can only restore to the last backup, not to any minute. Also the disk fills with unarchived WAL. Run `docker exec -u postgres hearth_pg pgbackrest --stanza=hearth check` and read the error."

      - alert: BackupStanzaUnhealthy
        expr: hearth_pgbackrest_status_ok == 0
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "pgBackRest reports a problem with a backup repository"
          description: "repo1 is the copy on this server, repo2 is the Backblaze bucket (see hearth_pgbackrest_repo_status_ok in Grafana/Prometheus for which one). If only repo2 is affected the usual cause is the bucket being unreachable (network, Backblaze outage, or a changed key); local backups keep working and it often clears by itself. On the server run: docker exec -u postgres <database container> pgbackrest --stanza=hearth info"

      - alert: BackupTooOld
        expr: time() - max(hearth_pgbackrest_last_backup_timestamp_seconds) > 93600
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "No backup has completed in over 26 hours"
          description: "The nightly backup did not run or failed. Read the newest /var/log/hearth-db/*-backup-*.log on the server and run the backup job by hand (scripts/job.sh backup-diff scripts/backup.sh diff)."

      - alert: FullBackupTooOld
        expr: time() - max(hearth_pgbackrest_last_backup_timestamp_seconds{type="full"}) > 691200
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "The weekly full backup is more than 8 days old"
          description: "The Sunday full backup did not run. Differential backups still work, but retention depends on regular fulls."

      - alert: OffsiteCopyMissing
        expr: hearth_pgbackrest_offsite_configured == 0
        for: 24h
        labels: { severity: warning }
        annotations:
          summary: "Backups only exist on this server"
          description: "No off-server copy is configured. If the server is lost, the backups go with it. Add the cloud bucket (see docs/DB_RECOVERY.md, section 'Off-server copy')."

      - alert: RestoreDrillFailed
        expr: hearth_restore_drill_ok == 0
        labels: { severity: critical }
        annotations:
          summary: "The automatic restore test failed"
          description: "A backup that cannot be restored is not a backup. Read the newest /var/log/hearth-db/*-restore-drill.log on the server for the reason."

      - alert: RestoreDrillStale
        expr: time() - hearth_restore_drill_last_success_timestamp_seconds > 777600
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "No successful restore test in over 9 days"
          description: "The weekly restore drill did not run or keeps failing. Run scripts/restore-drill.sh by hand in the database folder on the server."

      - alert: ScheduledJobFailed
        expr: hearth_job_last_exit_code != 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Scheduled job '{{ $labels.job }}' failed"
          description: "See the newest /var/log/hearth-db/*-{{ $labels.job }}.log on the server."

  - name: server
    rules:
      - alert: DiskAlmostFull
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "The server disk is more than 85% full"
          description: "A full disk stops the database. Free space (old backups under /var/www/dist-*, docker prune) before it reaches 100%."

      - alert: DiskFillingFast
        expr: predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[6h], 24 * 3600) < 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "The disk will be full within 24 hours at the current rate"
          description: "Something is writing a lot of data (logs, WAL, backups). Find it with `du -xh / | sort -h | tail`."

      - alert: LowMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "The server has less than 10% memory available"
          description: "The database or other containers may be killed. Check `docker stats`."

      - alert: MonitoringTargetDown
        expr: up == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Monitoring cannot reach '{{ $labels.job }}'"
          description: "Metrics for {{ $labels.job }} are missing, so alerts based on them cannot fire."

      - alert: HighCpu
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 85
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "The server CPU has been above 85% for 15 minutes"
          description: "See the Server dashboard, 'CPU by container', to find which container is busy."

      - alert: SiteDown
        expr: probe_success{job="website"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} is not answering"
          description: "The public address has not returned a normal response for 3 minutes. Check `docker ps` and nginx on the server."

      - alert: SslCertificateExpiring
        expr: (probe_ssl_earliest_cert_expiry{job="website"} - time()) < 14 * 86400
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "The HTTPS certificate for {{ $labels.instance }} expires in under 14 days"
          description: "Renew it (certbot renew) before visitors see a security warning."

      - alert: ContainerGone
        expr: time() - container_last_seen{name=~"pet_platform_.*|hearth_pg.*"} > 180
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Container {{ $labels.name }} is not running"
          description: "Start it with `docker start {{ $labels.name }}` and read `docker logs --tail 50 {{ $labels.name }}`."

      - alert: ContainerRestartingOften
        expr: changes(container_start_time_seconds{name=~"pet_platform_.*|hearth_pg.*"}[30m]) > 2
        labels: { severity: warning }
        annotations:
          summary: "Container {{ $labels.name }} restarted more than twice in 30 minutes"
          description: "It is crashing and being restarted. Read `docker logs --tail 100 {{ $labels.name }}`."
