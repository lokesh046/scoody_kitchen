# Hearth & One Postgres settings. Used instead of the default file (config_file=...), so every
# setting that differs from Postgres's built-in default is listed here.
# Sized for a shared 8 GB / 2 vCPU VPS where the database container is capped at 1.5 GB.

# --- connections
listen_addresses = '*'
unix_socket_directories = '/var/run/postgresql'
max_connections = 80
password_encryption = scram-sha-256

# --- memory
shared_buffers = 384MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 128MB

# --- WAL and continuous archiving (what makes restore-to-any-minute possible)
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=hearth archive-push %p'
archive_timeout = 60s          # an idle database still ships its WAL at least every minute it changed
wal_compression = on
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_senders = 4            # room for a standby later
hot_standby = on

# --- planner hints for SSD storage
random_page_cost = 1.1
effective_io_concurrency = 200

# --- safety nets for runaway sessions (roles can override)
idle_in_transaction_session_timeout = 5min
timezone = 'UTC'

# --- statistics and logging (read by the monitoring stack and by `docker logs`)
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
track_io_timing = on
log_destination = 'stderr'
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 1s
log_line_prefix = '%m [%p] %q%u@%d '
