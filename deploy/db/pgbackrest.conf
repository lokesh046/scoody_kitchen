# pgBackRest settings (inside the database container).
#
# Retention: a full backup every Sunday, a differential every other day, and every WAL segment in
# between. Keeping 3 fulls means the oldest one is always at least 14 days old, so any minute in
# the last 14 days can be restored (point-in-time recovery).
#
# Off-server copy: deploy.sh appends a [global] repo2-* block (S3-compatible bucket, encrypted)
# once /opt/hearth-db/offsite.env exists. Until then backups live on this server only.

[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=3
repo1-retention-diff=7
compress-type=zst
compress-level=3
process-max=2
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail

[hearth]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
