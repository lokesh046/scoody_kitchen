# Hearth & One database + monitoring. Lives on the server at /opt/hearth-db (see deploy.sh).
#
# - hearth_pg: Postgres 18 with pgBackRest (continuous WAL archiving, backups, point-in-time recovery)
# - prometheus, alertmanager, grafana, postgres_exporter, node_exporter, cadvisor, blackbox_exporter:
#   monitoring of the database, the whole VPS, every container and the public site, with email alerts
#
# Nothing here is published to the internet. Every port is bound to 127.0.0.1; reach Grafana and the
# database from your Mac through an SSH tunnel (docs in docs/DB_RECOVERY.md).
#
# One copy of this stack per environment: set ENV_NAME and APP_NETWORK in .env.

name: ${ENV_NAME:-hearth}-db

services:
  hearth_pg:
    build: .
    image: hearth-postgres:18
    container_name: ${PG_CONTAINER:-hearth_pg}
    restart: unless-stopped
    shm_size: 256mb
    mem_limit: 1536m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: hearth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8 --locale=C.UTF-8"
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - ${DATA_DIR:-/var/lib/hearth-db}/pgdata:/var/lib/postgresql
      - ${DATA_DIR:-/var/lib/hearth-db}/pgbackrest:/var/lib/pgbackrest
      - ${DATA_DIR:-/var/lib/hearth-db}/spool:/var/spool/pgbackrest
      - ${DATA_DIR:-/var/lib/hearth-db}/log:/var/log/pgbackrest
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./pgbackrest.rendered.conf:/etc/pgbackrest/pgbackrest.conf:ro
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-55432}:5432"
    networks: [app, internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hearth"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: ${ENV_NAME:-hearth}_postgres_exporter
    restart: unless-stopped
    mem_limit: 96m
    environment:
      DATA_SOURCE_NAME: "postgresql://hearth_monitor:${MONITOR_PW}@${PG_CONTAINER:-hearth_pg}:5432/hearth?sslmode=disable"
    command: ["--collector.stat_statements", "--collector.postmaster"]
    depends_on:
      hearth_pg: { condition: service_healthy }
    networks: [internal]

  node_exporter:
    image: prom/node-exporter:v1.9.1
    container_name: ${ENV_NAME:-hearth}_node_exporter
    restart: unless-stopped
    mem_limit: 64m
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
      - --collector.textfile.directory=/textfile
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/rootfs:ro
      - ${DATA_DIR:-/var/lib/hearth-db}/textfile:/textfile:ro
    networks: [internal]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: ${ENV_NAME:-hearth}_cadvisor
    restart: unless-stopped
    mem_limit: 192m
    command: ["--docker_only=true", "--housekeeping_interval=30s", "--store_container_labels=false",
              "--disable_metrics=disk,percpu,sched,tcp,udp,advtcp,hugetlb,referenced_memory,cpu_topology,resctrl,process"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [internal]

  blackbox_exporter:
    image: prom/blackbox-exporter:v0.27.0
    container_name: ${ENV_NAME:-hearth}_blackbox
    restart: unless-stopped
    mem_limit: 48m
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [internal]

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: ${ENV_NAME:-hearth}_prometheus
    restart: unless-stopped
    mem_limit: 384m
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${DATA_DIR:-/var/lib/hearth-db}/prometheus:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks: [internal]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: ${ENV_NAME:-hearth}_alertmanager
    restart: unless-stopped
    mem_limit: 64m
    user: "65534:65534"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager.rendered.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${DATA_DIR:-/var/lib/hearth-db}/alertmanager:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    networks: [internal]

  grafana:
    image: grafana/grafana-oss:12.0.2
    container_name: ${ENV_NAME:-hearth}_grafana
    restart: unless-stopped
    mem_limit: 320m
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: lokeshdeveloper
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${DATA_DIR:-/var/lib/hearth-db}/grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    networks: [internal]

networks:
  internal: {}
  app:
    external: true
    name: ${APP_NETWORK}
