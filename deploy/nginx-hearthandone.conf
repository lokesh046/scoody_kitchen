# Nginx config for hearthandone.com — serves the built Vite frontend as
# static files, and reverse-proxies the API on a separate subdomain so the
# backend's existing route paths (/product, /banners/, /auth/...) don't
# need an /api prefix added anywhere.
#
# Install:
#   sudo cp deploy/nginx-hearthandone.conf /etc/nginx/sites-available/hearthandone.com
#   sudo ln -s /etc/nginx/sites-available/hearthandone.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Do this AFTER the DNS A records for both hearthandone.com and
# api.hearthandone.com already resolve to this VPS's IP (see DEPLOY.md) —
# certbot below needs that to succeed.
#
# Then get real certificates (this rewrites this file to add the 443/ssl
# blocks and the http->https redirect automatically):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d hearthandone.com -d www.hearthandone.com -d api.hearthandone.com

# --- Web frontend: hearthandone.com / www.hearthandone.com ---
server {
    listen 80;
    listen [::]:80;
    server_name hearthandone.com www.hearthandone.com;

    # Match this to wherever you rsync/deploy the Vite build output.
    root /var/www/scoobys-kitchen/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The build's own prerender step (scripts/prerender.js) already emits
    # static .html files for some routes — try those before falling back to
    # the SPA shell, so prerendered pages are served as-is instead of being
    # swallowed by the client-side router.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Long-cache hashed build assets; index.html itself is deliberately not
    # cached here, so a new deploy is visible on next load, not stuck behind
    # a browser cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# --- Backend API: api.hearthandone.com ---
server {
    listen 80;
    listen [::]:80;
    server_name api.hearthandone.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Needed for the notifications WebSocket (app/core/redis_listener.py
        # / /notifications/ws) — a plain HTTP proxy_pass silently breaks the
        # Upgrade handshake without these two headers.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
