<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScoobyPets — Google OIDC Sign-In Test</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #0F172A;
            --card-bg: rgba(30, 41, 59, 0.8);
            --border: rgba(255, 255, 255, 0.1);
            --text: #F8FAFC;
            --subtext: #94A3B8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top right, #1E1B4B, #0F172A);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 8px 0;
            text-align: center;
            background: linear-gradient(to right, #818CF8, #C084FC);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            text-align: center;
            color: var(--subtext);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .btn-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .profile-card {
            display: none;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-top: 25px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            object-fit: cover;
        }

        .user-info h3 {
            margin: 0;
            font-size: 18px;
            color: var(--text);
        }

        .user-info p {
            margin: 4px 0 0 0;
            font-size: 13px;
            color: var(--subtext);
        }

        .badge {
            display: inline-block;
            background: #059669;
            color: #ECFDF5;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 999px;
            margin-top: 4px;
        }

        .token-box {
            background: #090D16;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            color: #38BDF8;
            word-break: break-all;
            max-height: 120px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .status {
            text-align: center;
            font-size: 13px;
            color: #E2E8F0;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ScoobyPets Google Sign-In</h1>
    <p class="subtitle">1-Click OIDC Authentication & Auto-Registration Demo</p>

    <div class="btn-wrapper">
        <div id="g_id_onload"
             data-client_id="535100728645-5835dhtvg6m4ufnbajlmrd71cvir9uqo.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin"
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="sign_in_with"
             data-shape="pill"
             data-logo_alignment="left">
        </div>
    </div>

    <div id="status" class="status">Click the Google button above to log in...</div>

    <div id="profileCard" class="profile-card">
        <div class="profile-header">
            <img id="avatarImg" class="avatar" src="" alt="Avatar">
            <div class="user-info">
                <h3 id="userName">User Name</h3>
                <p id="userEmail">user@gmail.com</p>
                <span id="roleBadge" class="badge">CUSTOMER</span>
            </div>
        </div>

        <p style="font-size:12px; color:var(--subtext); margin-bottom:5px; font-weight:bold;">Issued Platform Access Token:</p>
        <div id="tokenBox" class="token-box"></div>
    </div>
</div>

<script>
    async function handleCredentialResponse(response) {
        const statusEl = document.getElementById("status");
        statusEl.innerText = "⏳ Verifying Google ID Token with Backend...";

        try {
            // Send Google id_token to FastAPI backend POST /auth/google
            const res = await fetch("/auth/google", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id_token: response.credential })
            });

            if (!res.ok) {
                const errData = await res.json();
                statusEl.innerHTML = `<span style="color:#EF4444;">❌ Error: ${errData.detail || 'Authentication failed'}</span>`;
                return;
            }

            const tokens = await res.json();
            statusEl.innerHTML = `<span style="color:#10B981;">✅ Authenticated Successfully! Fetching /auth/me profile...</span>`;

            // Call GET /auth/me using issued Access Token
            const meRes = await fetch("/auth/me", {
                headers: { "Authorization": `Bearer ${tokens.access_token}` }
            });
            const user = await meRes.json();

            // Render profile card
            document.getElementById("profileCard").style.display = "block";
            document.getElementById("avatarImg").src = user.profile_image_url || "https://lh3.googleusercontent.com/a/default-user";
            document.getElementById("userName").innerText = `${user.first_name || ''} ${user.last_name || ''}`.trim() || user.email;
            document.getElementById("userEmail").innerText = user.email;
            document.getElementById("roleBadge").innerText = user.role.toUpperCase();
            document.getElementById("tokenBox").innerText = tokens.access_token;

        } catch (err) {
            statusEl.innerHTML = `<span style="color:#EF4444;">❌ Request Failed: ${err.message}</span>`;
        }
    }
</script>

</body>
</html>
