services:
  backend:
    build:
      context: ./pet-platform-backend
    container_name: pet_platform_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://pet_user:pet_password@postgres:5432/pet_platform}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-scooby_secure_redis_pass_2026}@redis:6379/0
      - WEB_CONCURRENCY=${BACKEND_WORKERS:-4}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-5}
    networks:
      - scooby_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pet_platform_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-scooby_secure_redis_pass_2026}
    # Note: No public host port published to ensure zero direct external access
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-scooby_secure_redis_pass_2026}
    networks:
      - scooby_net
    restart: unless-stopped

  mcp-server:
    build:
      context: ./pet-platform-mcp-server
    container_name: pet_platform_mcp_server
    # Note: No host port published to ensure zero direct external access
    environment:
      - PORT=8001
      - BACKEND_URL=http://backend:8000
      - REDIS_URL=redis://:${REDIS_PASSWORD:-scooby_secure_redis_pass_2026}@redis:6379/0
    networks:
      - scooby_net
    restart: unless-stopped

  chatbot-service:
    build:
      context: ./chatbot-service
    container_name: pet_platform_chatbot_service
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - MCP_SERVER_URL=http://mcp-server:8001
      - REDIS_URL=redis://:${REDIS_PASSWORD:-scooby_secure_redis_pass_2026}@redis:6379/0
      - WEB_CONCURRENCY=${CHATBOT_WORKERS:-4}
    networks:
      - scooby_net
    restart: unless-stopped

networks:
  scooby_net:
    driver: bridge
