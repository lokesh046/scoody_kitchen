# Load balancer for pet-platform-backend's three replicas. This is the only
# public entry point to the backend — backend_1/2/3 no longer publish host
# ports (see docker-compose.yml), so nothing can reach them except through
# this proxy.
#
# TLS/SSL is deliberately left out here — this only knows about your app,
# not your domain or certificates. Terminate TLS in front of this (certbot +
# a server block on 443 that proxies to this same upstream, or a provider's
# managed HTTPS layer) once you have a domain pointed at this VPS.

upstream backend_pool {
    # Passive health checks (available in open-source nginx, no extra
    # module needed): after 3 failed attempts within 30s, nginx stops
    # sending this replica traffic for 30s and retries it after that.
    server backend_1:8000 max_fails=3 fail_timeout=30s;
    server backend_2:8000 max_fails=3 fail_timeout=30s;
    server backend_3:8000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name _;

    # Matches gunicorn's own --timeout 60 in pet-platform-backend/Dockerfile
    # so nginx doesn't give up on a slow request before the app does.
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If a replica is down, retry the next one in the pool for this
        # request instead of surfacing a 502 to the user.
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
