# The only public entry point to the whole platform. backend_1,
# chatbot-service-1, and vision-service-1 publish no host ports of their own
# (see docker-compose.yml) — nothing can reach any of them except through
# this proxy. Previously chatbot-service and vision-service ran as single
# instances that published their ports directly, bypassing this box
# entirely; that's what the 8002/8003 server blocks below close off.
#
# Each pool below is currently sized to 1 server, matching the current VPS
# (2 vCPU / 8GB) — running 3 replicas of everything was tuned for a bigger
# box than this one. Scaling back up later (bigger VPS) means: add the
# replica block back in docker-compose.yml (see the comments there — the
# YAML anchors are kept specifically so this is a 3-line copy-paste), then
# uncomment/add the matching `server` line in the pool below. No other
# config changes needed — the location blocks already proxy to the pool
# name, not to a specific container.
#
# TLS: terminated here via Let's Encrypt (see docker-compose.yml's certbot
# service and scripts/init-letsencrypt.sh for the one-time setup). Every
# port below has an HTTPS counterpart; plain HTTP is kept only on 80 to
# redirect to HTTPS and to serve the ACME challenge certbot's renewal needs.
# Replace scoobyskitchen.com below with your real domain before running the
# init script.

upstream backend_pool {
    # Passive health checks (available in open-source nginx, no extra
    # module needed): after 3 failed attempts within 30s, nginx stops
    # sending this replica traffic for 30s and retries it after that.
    server backend_1:8000 max_fails=3 fail_timeout=30s;
    # server backend_2:8000 max_fails=3 fail_timeout=30s;
    # server backend_3:8000 max_fails=3 fail_timeout=30s;
}

upstream chatbot_pool {
    # Safe to load balance whenever you add replicas back:
    # utils/rate_limiter.py is Redis-backed, so multiple instances share
    # the same rate-limit/budget counters correctly.
    server chatbot-service-1:8002 max_fails=3 fail_timeout=30s;
    # server chatbot-service-2:8002 max_fails=3 fail_timeout=30s;
    # server chatbot-service-3:8002 max_fails=3 fail_timeout=30s;
}

upstream vision_pool {
    # Safe to load balance whenever you add replicas back: both the burst
    # limiter and daily scan cap in app/services/security.py are
    # Redis-backed, so multiple instances share the same counters
    # correctly.
    server vision-service-1:8003 max_fails=3 fail_timeout=30s;
    # server vision-service-2:8003 max_fails=3 fail_timeout=30s;
    # server vision-service-3:8003 max_fails=3 fail_timeout=30s;
}

# Plain HTTP on 80: only serves the ACME challenge (certbot proves domain
# ownership by putting a file here and having Let's Encrypt fetch it) and
# redirects everything else to HTTPS. Never proxies real traffic in the
# clear.
server {
    listen 80;
    server_name scoobyskitchen.com www.scoobyskitchen.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name scoobyskitchen.com www.scoobyskitchen.com;

    ssl_certificate /etc/letsencrypt/live/scoobyskitchen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scoobyskitchen.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Matches gunicorn's own --timeout 60 in pet-platform-backend/Dockerfile
    # so nginx doesn't give up on a slow request before the app does.
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # nginx's own default (1MB) is smaller than what the app itself allows
    # for banner/review/product image uploads (5MB, see
    # storage_service.py's MAX_FILE_SIZE_BYTES) — without this, those
    # uploads would get rejected by nginx with a 413 before ever reaching
    # the app.
    client_max_body_size 10m;

    location / {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If a replica is down, retry the next one in the pool for this
        # request instead of surfacing a 502 to the user.
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}

# chatbot-service: 1 instance behind chatbot_pool currently (see the pool's
# comment above for how to add more back). Chat/voice responses stream over SSE
# (text/event-stream), so proxy_buffering must stay off here — otherwise
# nginx holds the whole response until it ends before forwarding any of
# it, defeating the point of streaming — and the read timeout is generous
# since a model response can take a while to finish streaming.
server {
    listen 8002 ssl;
    server_name scoobyskitchen.com;

    # Same certificate as the 443 block — Let's Encrypt certs cover a
    # domain, not a specific port, so no separate issuance needed here.
    ssl_certificate /etc/letsencrypt/live/scoobyskitchen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scoobyskitchen.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20m;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_buffering off;

    location / {
        proxy_pass http://chatbot_pool;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If a replica is down, retry the next one in the pool for this
        # request instead of surfacing a 502 to the user. Excludes timeout
        # since a slow-but-alive stream shouldn't get silently retried
        # (that would double the LLM call).
        proxy_next_upstream error http_502 http_503 http_504;
    }
}

# vision-service: 1 instance behind vision_pool currently (see the pool's
# comment above for how to add more back). client_max_body_size matches the
# 15MB cap the service itself enforces (MAX_FILE_SIZE in routes.py) — a
# photo upload just under that limit would otherwise be rejected by nginx
# first.
server {
    listen 8003 ssl;
    server_name scoobyskitchen.com;

    ssl_certificate /etc/letsencrypt/live/scoobyskitchen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scoobyskitchen.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20m;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://vision_pool;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If a replica is down, retry the next one in the pool for this
        # request instead of surfacing a 502 to the user.
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
