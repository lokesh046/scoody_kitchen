[project]
name = "pet-vision-service"
version = "0.1.0"
description = "Microservice for AI-powered pet species and breed classification with in-memory inference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "onnxruntime>=1.19.0",
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.2.3",
    "pyjwt>=2.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "venv", ".git"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
