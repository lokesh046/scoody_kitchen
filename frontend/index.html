<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/scooby-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="origin-when-cross-origin" />
    <title>Scooby's Kitchen | Honest Small-Batch Pet Cooking</title>
    <meta name="description" content="Human-grade, small-batch pet food cooked under veterinary supervision. Transparent recipes for pet parents who care." />

    <!-- Static, site-wide defaults for link previews (WhatsApp, Facebook,
         Twitter/X, iMessage, Slack, etc.). These crawlers largely don't run
         JavaScript, so useDocumentMetadata's per-page updates (see
         src/hooks/useDocumentMetadata.ts) never reach them — they only ever
         see what's here in the raw HTML. Per-page updates still matter for
         Google, which does render JS before indexing. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Scooby's Kitchen" />
    <meta property="og:url" content="https://www.scoobyskitchen.com/" />
    <meta property="og:title" content="Scooby's Kitchen | Honest Small-Batch Pet Cooking" />
    <meta property="og:description" content="Human-grade, small-batch pet food cooked under veterinary supervision. Transparent recipes for pet parents who care." />
    <meta property="og:image" content="https://www.scoobyskitchen.com/images/scoobys_fam_banner.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Scooby's Kitchen | Honest Small-Batch Pet Cooking" />
    <meta name="twitter:description" content="Human-grade, small-batch pet food cooked under veterinary supervision. Transparent recipes for pet parents who care." />
    <meta name="twitter:image" content="https://www.scoobyskitchen.com/images/scoobys_fam_banner.jpg" />

    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
