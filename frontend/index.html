<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/scooby-logo-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="origin-when-cross-origin" />
    <title>Hearth & One | Honest Small-Batch Pet Cooking</title>
    <meta name="description" content="Human-grade, small-batch pet food cooked under veterinary supervision. Transparent recipes for pet parents who care." />

    <!-- Static, site-wide defaults for link previews (WhatsApp, Facebook,
         Twitter/X, iMessage, Slack, etc.). These crawlers largely don't run
         JavaScript, so useDocumentMetadata's per-page updates (see
         src/hooks/useDocumentMetadata.ts) never reach them — they only ever
         see what's here in the raw HTML. Per-page updates still matter for
         Google, which does render JS before indexing. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hearth & One" />
    <meta property="og:url" content="https://hearthandone.com/" />
    <meta property="og:title" content="Hearth & One | Honest Small-Batch Pet Cooking" />
    <meta property="og:description" content="Human-grade, small-batch pet food cooked under veterinary supervision. Transparent recipes for pet parents who care." />
    <meta property="og:image" content="https://hearthandone.com/images/scoobys_fam_banner.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hearth & One | Honest Small-Batch Pet Cooking" />
    <meta name="twitter:description" content="Human-grade, small-batch pet food cooked under veterinary supervision. Transparent recipes for pet parents who care." />
    <meta name="twitter:image" content="https://hearthandone.com/images/scoobys_fam_banner.jpg" />

    <!-- Fonts loaded as a direct <link>, not CSS @import -- @import inside
         index.css is render-blocking and delays font discovery until after
         the stylesheet itself downloads and parses. A <link> here lets the
         browser discover and fetch fonts in parallel with everything else. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Quicksand:wght@300;400;500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Lobster&family=Parisienne&display=swap" />

    <!-- The dark landing pages (home, shop, pets, consultations) otherwise flash a blank
         white page, then a cream one (the stylesheet's body background), before the dark
         hero appears. Mark them from the very first paint; App.tsx keeps the mark correct
         on navigation. Keep the colour in sync with `midnight` in tailwind.config and the
         path list in sync with DARK_LANDING_PATHS in src/App.tsx. -->
    <style>
      html.dark-landing, html.dark-landing body { background-color: #0E0B08; }
      /* Prerendered content made for a different route (see below) is never shown. */
      html.not-prerendered #root[data-prerendered-path] { display: none; }
    </style>
    <script>
      (function () {
        var norm = function (p) { return p.replace(/\/+$/, '') || '/'; };
        var path = norm(location.pathname);
        var made = document.documentElement.getAttribute('data-prerendered-path');
        // The server serves the prerendered home page for every route without its own prerendered
        // file (/privacy, /login, ...). Decide here, before the body is parsed, so that page is
        // never painted. scripts/prerender.js tags <html> and #root with the route they were made for.
        if (made !== null && norm(made) !== path) document.documentElement.classList.add('not-prerendered');
        if (path === '/' || path === '/shop' || path === '/pets' || path === '/consultations') {
          document.documentElement.classList.add('dark-landing');
        }
      })();
    </script>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Remove prerendered content that isn't for this URL (it is already hidden by the <head>
      // script above), and un-tag the root so React can render into a visible element.
      (function () {
        var root = document.getElementById('root');
        if (root && document.documentElement.classList.contains('not-prerendered')) {
          root.innerHTML = '';
          root.removeAttribute('data-prerendered-path');
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
