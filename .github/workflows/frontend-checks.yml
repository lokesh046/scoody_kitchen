name: Frontend checks

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-checks.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-checks.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        # No test suite exists yet for this app — this at least catches
        # type errors and build breakage, which is more than nothing.
        run: npm run build
        env:
          # Sitemap generation degrades gracefully with no SITE_URL/API to
          # reach — no real backend or domain needed for this to succeed.
          SITE_URL: ""
