name: Mobile checks

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-checks.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-checks.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        # No lint config and no test suite exist yet for this app — this is
        # the one automated check available today. tsc --noEmit is the same
        # command used manually to verify every feature built this session.
        run: npm run ts:check
