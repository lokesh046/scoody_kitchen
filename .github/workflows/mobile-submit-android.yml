name: Mobile submit (Android)

# The manual go-ahead gate for Android releases. Never runs on its own — only when
# someone explicitly runs it from the Actions tab. Rebuilds the production bundle
# fresh (same as mobile-build-android.yml) rather than trusting a possibly-stale
# artifact, then uploads it to the chosen Play Console track.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Console track"
        required: true
        default: internal
        type: choice
        options: [internal, production]
      rollout_percentage:
        description: "Rollout fraction for a production release (e.g. 1.0 for 100%). Ignored for internal."
        required: false
        default: "1.0"

jobs:
  submit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure the pinned NDK version is installed
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006"

      - name: Reconstruct signing + Firebase config from secrets
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > google-services.json

      - name: Set an always-increasing versionCode for this build
        run: |
          CODE=$((100 + ${{ github.run_number }}))
          sed -i "s/versionCode [0-9]\+/versionCode $CODE/" android/app/build.gradle

      - name: Build production bundle
        working-directory: mobile/android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: ./gradlew bundleProductionRelease

      - name: Upload to Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.scooby.kitchen
          releaseFiles: mobile/android/app/build/outputs/bundle/productionRelease/app-production-release.aab
          track: ${{ inputs.track }}
          userFraction: ${{ inputs.track == 'production' && inputs.rollout_percentage || '' }}
          status: ${{ inputs.track == 'production' && inputs.rollout_percentage != '1.0' && 'inProgress' || 'completed' }}

      - name: Clean up decoded keystore
        if: always()
        run: shred -u android/app/release.keystore android/keystore.properties 2>/dev/null || true
