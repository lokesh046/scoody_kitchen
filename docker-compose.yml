services:
  backend:
    build:
      context: ./pet-platform-backend
    container_name: pet_platform_backend
    ports:
      - "8000:8000"
    env_file:
      - ./pet-platform-backend/.env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-scooby_secure_redis_pass_2026}@redis:6379/0
    networks:
      - scooby_net
    restart: unless-stopped

  celery-worker:
    build:
      context: ./pet-platform-backend
    container_name: pet_platform_celery_worker
    command: celery -A app.core.celery_app worker --beat --loglevel=info
    env_file:
      - ./pet-platform-backend/.env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-scooby_secure_redis_pass_2026}@redis:6379/0
    networks:
      - scooby_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pet_platform_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-scooby_secure_redis_pass_2026}
    # Note: No public host port published to protect from external access.
    # If local host debugging is needed, bind strictly to localhost:
    # ports:
    #   - "127.0.0.1:6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-scooby_secure_redis_pass_2026}
    networks:
      - scooby_net
    restart: unless-stopped

  mcp-server:
    build:
      context: ./pet-platform-mcp-server
    container_name: pet_platform_mcp_server
    # Note: No host port published to ensure zero direct external access
    environment:
      - PORT=8001
      - BACKEND_URL=http://backend:8000
      - REDIS_URL=redis://:${REDIS_PASSWORD:-scooby_secure_redis_pass_2026}@redis:6379/0
    networks:
      - scooby_net
    restart: unless-stopped

  chatbot-service:
    build:
      context: ./chatbot-service
    container_name: pet_platform_chatbot_service
    ports:
      - "8002:8002"
    env_file:
      - ./chatbot-service/.env
    environment:
      - PORT=8002
      - MCP_SERVER_URL=http://mcp-server:8001
      - REDIS_URL=redis://:${REDIS_PASSWORD:-scooby_secure_redis_pass_2026}@redis:6379/0
    networks:
      - scooby_net
    restart: unless-stopped

  vision-service:
    build:
      context: ./pet-vision-service
    container_name: pet_platform_vision_service
    ports:
      - "8003:8003"
    env_file:
      - ./pet-vision-service/.env
    networks:
      - scooby_net
    restart: unless-stopped

networks:
  scooby_net:
    driver: bridge
