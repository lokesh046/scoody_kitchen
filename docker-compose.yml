services:
  # --- Database connection pooling -------------------------------------
  # Sits between the backend replicas and Neon. Without this, 3 backend
  # replicas x WEB_CONCURRENCY=4 gunicorn workers x (DB_POOL_SIZE=10 +
  # DB_MAX_OVERFLOW=5) = 180 direct Postgres connections from one VPS —
  # likely past what your Neon plan allows, causing "too many connections"
  # outright outages rather than slowdowns. PgBouncer in transaction mode
  # multiplexes those onto a much smaller number of real upstream connections.
  #
  # Uses edoburu/pgbouncer, which builds pgbouncer.ini from env vars instead
  # of needing a hand-written ini file with credentials baked into it.
  # Fill in the PGBOUNCER_* vars in your root .env from your existing Neon
  # DATABASE_URL (postgresql://USER:PASSWORD@HOST:PORT/DBNAME).
  #
  # CAVEAT: Neon requires SSL. Confirm this image's default server-side SSL
  # behavior is acceptable for your Neon endpoint (check its docs for
  # server_tls_sslmode) before relying on this in production — this file
  # assumes the image's default handles it, which may need adjusting for
  # your specific Neon project.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pet_platform_pgbouncer
    environment:
      - DB_HOST=${PGBOUNCER_DB_HOST}
      - DB_PORT=${PGBOUNCER_DB_PORT:-5432}
      - DB_USER=${PGBOUNCER_DB_USER}
      - DB_PASSWORD=${PGBOUNCER_DB_PASSWORD}
      - DB_NAME=${PGBOUNCER_DB_NAME}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=500
      - DEFAULT_POOL_SIZE=25
      - AUTH_TYPE=scram-sha-256
    # No host port published — only reachable from other containers on
    # scooby_net, same as redis and mcp-server.
    networks:
      - scooby_net
    restart: unless-stopped

  # --- Backend replicas ---------------------------------------------------
  # Sized down to 1 instance for the current VPS (2 vCPU / 8GB RAM) — 3
  # replicas x 4 gunicorn workers each was tuned for a bigger box than this
  # one. The &backend_replica anchor is kept so scaling back up later is a
  # 3-line copy-paste: add
  #   backend_2:
  #     <<: *backend_replica
  #     container_name: pet_platform_backend_2
  # (and backend_3 the same way), then add the matching `server` lines to
  # backend_pool in nginx/nginx.conf. WEB_CONCURRENCY is explicit here (2,
  # not the Dockerfile's default of 4) to match this VPS's 2 CPU cores —
  # bump it back up when the VPS grows.
  #
  # None publish a host port: nginx is the only public entry point now.
  backend_1: &backend_replica
    build:
      context: ./pet-platform-backend
    container_name: pet_platform_backend_1
    env_file:
      - ./pet-platform-backend/.env
    volumes:
      - ./pet-platform-backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    environment:
      - WEB_CONCURRENCY=2
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_REDIS_URL=redis://:${REDIS_PASSWORD}@redis-celery:6379/0
      - RATE_LIMIT_REDIS_URL=redis://:${REDIS_PASSWORD}@redis-limiter:6379/0
      # Overrides whatever DATABASE_URL is in .env (which still points
      # directly at Neon, e.g. for one-off scripts run outside Docker) —
      # the running app now goes through pgbouncer instead.
      - DATABASE_URL=postgresql+psycopg://${PGBOUNCER_DB_USER}:${PGBOUNCER_DB_PASSWORD}@pgbouncer:6432/${PGBOUNCER_DB_NAME}
    networks:
      - scooby_net
    restart: unless-stopped
    depends_on:
      - pgbouncer

  # --- Load balancer -------------------------------------------------------
  # The only service publishing host ports now — see nginx/nginx.conf for
  # the load-balancing/health-check config (port 80/443, backend) and the
  # per-service proxy blocks (8002 chatbot-service, 8003 vision-service).
  # TLS certs come from the certbot service below via the shared
  # certbot-conf volume; certbot-www is the shared ACME challenge directory
  # certbot needs to prove domain ownership (see nginx.conf's port-80
  # block and scripts/init-letsencrypt.sh).
  nginx:
    image: nginx:1.27-alpine
    container_name: pet_platform_nginx
    ports:
      - "80:80"
      - "443:443"
      - "8002:8002"
      - "8003:8003"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - scooby_net
    restart: unless-stopped
    depends_on:
      - backend_1
      - chatbot-service-1
      - vision-service-1

  # Issues and auto-renews the Let's Encrypt certificate nginx serves.
  # Doesn't touch nginx directly (no Docker-socket access granted, since
  # that's broad privilege for a small side project) — it only refreshes
  # the certificate files in the shared certbot-conf volume. Picking up a
  # renewed cert still needs an `nginx -s reload`, which
  # scripts/reload-nginx-cron.sh runs on a host crontab (daily is plenty,
  # since certbot only actually renews within 30 days of expiry).
  certbot:
    image: certbot/certbot:latest
    container_name: pet_platform_certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"
    restart: unless-stopped

  # Task execution only — no --beat here. This is what you'd add replicas of
  # for more task throughput later (celery-worker-2, -3, ...), since workers
  # pulling from the same broker is exactly what Celery is designed to
  # scale that way. --beat was split out into its own service below
  # specifically so this one is safe to duplicate: Celery Beat is a
  # scheduler, not a worker, and running it more than once means every
  # periodic task fires once per Beat instance instead of once total — N
  # replicas of a combined "worker --beat" container would silently
  # multiply every scheduled job by N.
  celery-worker:
    build:
      context: ./pet-platform-backend
    container_name: pet_platform_celery_worker
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - ./pet-platform-backend/.env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_REDIS_URL=redis://:${REDIS_PASSWORD}@redis-celery:6379/0
      # Left pointing directly at Neon (via .env), not through pgbouncer —
      # a single long-lived worker process doesn't multiply connections
      # the way N backend replicas x M gunicorn workers does, and Celery
      # tasks can hold longer transactions than pgbouncer's transaction
      # pooling mode is meant for.
    networks:
      - scooby_net
    restart: unless-stopped

  # The scheduler — must always be exactly one instance, never scaled,
  # unlike celery-worker above. It only decides when a periodic task is due
  # and hands it to the broker; celery-worker (however many replicas exist)
  # is what actually executes it.
  celery-beat:
    build:
      context: ./pet-platform-backend
    container_name: pet_platform_celery_beat
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file:
      - ./pet-platform-backend/.env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_REDIS_URL=redis://:${REDIS_PASSWORD}@redis-celery:6379/0
    networks:
      - scooby_net
    restart: unless-stopped

  # --- Redis, split by role ------------------------------------------------
  # Previously one Redis instance served caching, the Celery broker, and
  # rate-limiter storage together — a spike or memory pressure on any one
  # role (e.g. a cache stampede) could starve or evict data for the other
  # two, since maxmemory/eviction policy is set per-instance, not per-DB-
  # index. Splitting into separate containers means each role has its own
  # memory ceiling and CPU thread, and one saturating doesn't take the
  # others down with it. Cache is the only role safe to lose entirely
  # (a cold cache just costs a slower request), so it's the only one this
  # setup names "disposable."
  redis:
    image: redis:7-alpine
    container_name: pet_platform_redis
    # allkeys-lru: safe to evict anything here — a cache miss just costs one
    # extra DB query, never a correctness bug (unlike redis-celery/-limiter
    # below, which deliberately have NO eviction policy). LRU fits this
    # workload's temporal locality (recently-viewed products/categories are
    # likely to be requested again soon) without needing measured proof of a
    # long-term popularity skew, which is what LFU would need to pay off.
    # REDIS_CACHE_MAXMEMORY is adjustable per-VPS in your .env — size it to
    # a fraction of the host's actual RAM, not a guess.
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory ${REDIS_CACHE_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru
    # Note: No public host port published to protect from external access.
    # If local host debugging is needed, bind strictly to localhost:
    # ports:
    #   - "127.0.0.1:6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - scooby_net
    restart: unless-stopped

  # Celery broker + result backend only. Must not use an eviction policy —
  # losing a queued task silently is a correctness bug, not just a slower
  # request — so this stays on its own instance rather than sharing one
  # tuned for cache eviction.
  redis-celery:
    image: redis:7-alpine
    container_name: pet_platform_redis_celery
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - scooby_net
    restart: unless-stopped

  # Rate-limiter counters (slowapi, app/core/limiter.py). Small footprint,
  # but needs to stay responsive under the exact traffic spikes that would
  # also be hammering the cache — kept separate so a cache stampede can't
  # also blind the rate limiter.
  redis-limiter:
    image: redis:7-alpine
    container_name: pet_platform_redis_limiter
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - scooby_net
    restart: unless-stopped

  mcp-server:
    build:
      context: ./pet-platform-mcp-server
    container_name: pet_platform_mcp_server
    # Note: No host port published to ensure zero direct external access
    env_file:
      - ./pet-platform-mcp-server/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - BACKEND_URL=http://nginx:80
      - MCP_INTERNAL_SECRET=${MCP_INTERNAL_SECRET}
      - MCP_CALL_TOKEN_SECRET=${MCP_CALL_TOKEN_SECRET}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    networks:
      - scooby_net
    restart: unless-stopped

  # --- Shared ML inference ------------------------------------------------
  # Loads the embedding model (and, lazily, Prompt Guard) exactly once —
  # see ml-inference-service/main.py. chatbot-service's workers call this
  # instead of loading torch/transformers themselves, so CHATBOT_WORKERS can
  # scale without multiplying model memory. No host port published —
  # internal-only, same as mcp-server.
  ml-inference:
    build:
      context: ./ml-inference-service
    container_name: pet_platform_ml_inference
    env_file:
      - ./ml-inference-service/.env
    environment:
      - PORT=8010
    networks:
      - scooby_net
    restart: unless-stopped

  # --- Chatbot replica(s) -----------------------------------------------------
  # Sized down to 1 instance for the current VPS (2 vCPU / 8GB) — the
  # &chatbot_replica anchor is kept so adding more back later is a 3-line
  # copy-paste, same as described above for backend_2/backend_3:
  #   chatbot-service-2:
  #     <<: *chatbot_replica
  #     container_name: pet_platform_chatbot_service_2
  # then add the matching `server` line to chatbot_pool in
  # nginx/nginx.conf. Already safe to scale whenever you do — utils/
  # rate_limiter.py is Redis-backed, so multiple instances would correctly
  # share the same rate-limit/budget counters. WEB_CONCURRENCY dropped to 2
  # (from the default of 4) to match this VPS's 2 CPU cores.
  # No host port published — reachable only via nginx (see nginx/nginx.conf's
  # :8002 server block / chatbot_pool upstream), same as the backend.
  chatbot-service-1: &chatbot_replica
    build:
      context: ./chatbot-service
    container_name: pet_platform_chatbot_service_1
    env_file:
      - ./chatbot-service/.env
    environment:
      - PORT=8002
      - MCP_SERVER_URL=http://mcp-server:8001/sse
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ML_INFERENCE_URL=http://ml-inference:8010
      - WEB_CONCURRENCY=${CHATBOT_WORKERS:-2}
    networks:
      - scooby_net
    restart: unless-stopped
    depends_on:
      - ml-inference

  # --- Vision replica(s) -------------------------------------------------------
  # Sized down to 1 instance for the current VPS, same reasoning as above —
  # the &vision_replica anchor makes adding vision-service-2/3 back later a
  # 3-line copy-paste plus the matching `server` line in vision_pool
  # (nginx/nginx.conf). Already safe to scale whenever you do — both the
  # burst limiter and daily scan cap in app/services/security.py are
  # Redis-backed.
  #
  # Cost note for when you do scale this: each replica loads its own full
  # copy of the ONNX model into RAM on startup (unlike chatbot-service's
  # shared ml-inference-service), so N replicas means roughly Nx that
  # model's memory footprint.
  #
  # No host port published — reachable only via nginx (see nginx/nginx.conf's
  # :8003 server block / vision_pool upstream), same as the backend.
  vision-service-1: &vision_replica
    build:
      context: ./pet-vision-service
    container_name: pet_platform_vision_service_1
    env_file:
      - ./pet-vision-service/.env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-latest}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      # Reuses the backend's isolated rate-limiter Redis instance for the
      # per-user daily scan cap and (now) the per-minute burst limiter too
      # (see app/services/security.py).
      - RATE_LIMIT_REDIS_URL=redis://:${REDIS_PASSWORD}@redis-limiter:6379/2
    networks:
      - scooby_net
    restart: unless-stopped
    depends_on:
      - redis-limiter

networks:
  scooby_net:
    driver: bridge

volumes:
  certbot-conf:
  certbot-www:
