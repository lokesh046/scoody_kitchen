services:
  backend:
    build:
      context: ./pet-platform-backend
    container_name: pet_platform_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://pet_user:pet_password@postgres:5432/pet_platform}
    networks:
      - scooby_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pet_platform_redis
    ports:
      - "6379:6379"
    networks:
      - scooby_net
    restart: unless-stopped

  mcp-server:
    build:
      context: ./pet-platform-mcp-server
    container_name: pet_platform_mcp_server
    # Note: No host port published to ensure zero direct external access
    environment:
      - PORT=8001
      - BACKEND_URL=http://backend:8000
    networks:
      - scooby_net
    restart: unless-stopped

  chatbot-service:
    build:
      context: ./chatbot-service
    container_name: pet_platform_chatbot_service
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - MCP_SERVER_URL=http://mcp-server:8001
      - REDIS_URL=redis://redis:6379/0
    networks:
      - scooby_net
    restart: unless-stopped

networks:
  scooby_net:
    driver: bridge
