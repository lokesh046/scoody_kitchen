services:
  backend:
    build:
      context: ./pet-platform-backend
    container_name: pet_platform_backend
    ports:
      - "8000:8000"
    env_file:
      - ./pet-platform-backend/.env
    volumes:
      - ./pet-platform-backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-scooby_secure_redis_pass_2026}@redis:6379/0
    networks:
      - scooby_net
    restart: unless-stopped

  celery-worker:
    build:
      context: ./pet-platform-backend
    container_name: pet_platform_celery_worker
    command: celery -A app.core.celery_app worker --beat --loglevel=info
    env_file:
      - ./pet-platform-backend/.env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-scooby_secure_redis_pass_2026}@redis:6379/0
    networks:
      - scooby_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pet_platform_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-scooby_secure_redis_pass_2026}
    # Note: No public host port published to protect from external access.
    # If local host debugging is needed, bind strictly to localhost:
    # ports:
    #   - "127.0.0.1:6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-scooby_secure_redis_pass_2026}
    networks:
      - scooby_net
    restart: unless-stopped

  mcp-server:
    build:
      context: ./pet-platform-mcp-server
    container_name: pet_platform_mcp_server
    # Note: No host port published to ensure zero direct external access
    env_file:
      - ./pet-platform-mcp-server/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - BACKEND_URL=http://backend:8000
      - MCP_INTERNAL_SECRET=${MCP_INTERNAL_SECRET:-b6cf6e7c858d1552abd4146977b7a1d3be3987b52f495fac97984a833bd18424}
      - MCP_CALL_TOKEN_SECRET=${MCP_CALL_TOKEN_SECRET:-d7a5b3c2e1f49687a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-scooby_secure_redis_pass_2026}@redis:6379/0
    networks:
      - scooby_net
    restart: unless-stopped

  chatbot-service:
    build:
      context: ./chatbot-service
    container_name: pet_platform_chatbot_service
    ports:
      - "8002:8002"
    env_file:
      - ./chatbot-service/.env
    environment:
      - PORT=8002
      - MCP_SERVER_URL=http://mcp-server:8001/sse
      - REDIS_URL=redis://:${REDIS_PASSWORD:-scooby_secure_redis_pass_2026}@redis:6379/0
    networks:
      - scooby_net
    restart: unless-stopped

  vision-service:
    build:
      context: ./pet-vision-service
    container_name: pet_platform_vision_service
    ports:
      - "8003:8003"
    env_file:
      - ./pet-vision-service/.env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AQ.Ab8RN6L1IodKTgeF_Oa3Yri5T89DzEFdT45sYBc4DtAcp6vhEg}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-a9F8xK3mP2qR7vW0zY4bN8cL1dE6fG9hJ3kM5nP8rT1uV4wX7zY0aB3cD6eF9gH2}
      - JWT_ALGORITHM=HS256
    networks:
      - scooby_net
    restart: unless-stopped

networks:
  scooby_net:
    driver: bridge
